name: Update industry news

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-industry-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, translate and classify
        run: npm run news:update
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/chat/completions
          LLM_MODEL: deepseek-chat
          NEWS_LOOKBACK_HOURS: "36"
      - name: Commit daily brief
        run: |
          git config user.name "hangli-news-bot"
          git config user.email "hangli-news-bot@users.noreply.github.com"
          git add app/industry-news/news-data.ts public/news
          git diff --cached --quiet && exit 0
          git commit -m "chore(news): update daily AI brief"
          git push
