name: Update industry news

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-industry-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, translate and classify
        run: npm run news:update
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/chat/completions
          LLM_MODEL: deepseek-chat
          NEWS_LOOKBACK_HOURS: "36"
      - name: Commit daily brief
        run: |
          git config user.name "hangli-news-bot"
          git config user.email "hangli-news-bot@users.noreply.github.com"
          git add app/industry-news/news-data.ts public/news
          git diff --cached --quiet && exit 0
          git commit -m "chore(news): update daily AI brief"
          git push
      - name: Sync news data to Tencent Cloud
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          test -n "$TENCENT_HOST"
          test -n "$TENCENT_USER"
          test -n "$TENCENT_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$TENCENT_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            --rsync-path="sudo rsync" \
            public/news/ "$TENCENT_USER@$TENCENT_HOST:/var/www/hanglilabs/news/"
