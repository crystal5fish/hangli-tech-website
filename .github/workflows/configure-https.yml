name: Configure HTTPS on Tencent Cloud

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-https.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Nginx and issue certificate
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          test -n "$TENCENT_HOST"
          test -n "$TENCENT_USER"
          test -n "$TENCENT_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$TENCENT_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-nginx"

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            'sudo tee /etc/nginx/sites-available/hanglilabs >/dev/null' <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name hanglilabs.com www.hanglilabs.com;

              root /var/www/hanglilabs;
              index index.html;

              location = /industry-news/ {
                  try_files /industry-news.html =404;
              }

              location / {
                  try_files $uri.html $uri/index.html $uri =404;
              }
          }
          NGINX

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "sudo ln -sfn /etc/nginx/sites-available/hanglilabs /etc/nginx/sites-enabled/hanglilabs && sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d hanglilabs.com -d www.hanglilabs.com && sudo nginx -t && sudo systemctl reload nginx"
